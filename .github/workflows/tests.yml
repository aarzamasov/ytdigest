name: tests

on:
  push:
  pull_request:

jobs:
  offline-tests:
    # The core suite needs no network, no yt-dlp and no Whisper: everything is faked.
    # The matrix matters because the tool is used on macOS (Apple Silicon) and Windows 11.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Byte-compile
        run: python -m compileall -q .
      - name: Run tests
        run: python tests/run_all.py

  quality:
    # Lint, formatting, static types, and the test suite with Hypothesis installed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: Tests incl. property-based module
        run: python tests/run_all.py
